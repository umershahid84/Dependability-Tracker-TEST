# Apache Virtual Host Configuration for Dependability Tracker
# VPN Access with HTTPS on Port 443
#
# Installation Instructions:
# 1. Copy this file to:
#    - Ubuntu/Debian: /etc/apache2/sites-available/dependability-tracker.conf
#    - RHEL/CentOS: /etc/httpd/conf.d/dependability-tracker.conf
#
# 2. Customize the following placeholders:
#    - dependability-tracker.yourdomain.com → Your domain or VPN hostname
#    - /path/to/ssl/*.{crt,key} → Your SSL certificate paths
#    - 10.0.0.0/8 → Your VPN subnet
#    - localhost:3000 → Your Node.js server address (match PORT in .env)
#
# 3. Enable required Apache modules:
#    sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite
#
# 4. Enable the site (Ubuntu/Debian only):
#    sudo a2ensite dependability-tracker.conf
#
# 5. Test configuration and restart:
#    sudo apache2ctl configtest  # or apachectl configtest
#    sudo systemctl restart apache2  # or httpd

<VirtualHost *:443>
    # ============================================================================
    # Basic Server Configuration
    # ============================================================================
    
    # Set this to your domain name or VPN IP address
    ServerName dependability-tracker.yourdomain.com
    
    # Alternative: Use IP address if no domain
    # ServerName 10.x.x.x
    
    # Administrator email for server errors
    ServerAdmin admin@yourdomain.com
    
    # ============================================================================
    # SSL/TLS Configuration
    # ============================================================================
    
    SSLEngine on
    
    # Path to your SSL certificate file
    # Option 1: Use self-signed certificates from the project
    #           SSLCertificateFile /path/to/project/cert/certificate.pem
    # Option 2: Use Let's Encrypt certificates
    #           SSLCertificateFile /etc/letsencrypt/live/your-domain/fullchain.pem
    # Option 3: Use corporate/internal CA certificates
    #           SSLCertificateFile /path/to/ssl/certificate.crt
    SSLCertificateFile /path/to/ssl/certificate.crt
    
    # Path to your SSL private key
    # Option 1: Self-signed: /path/to/project/cert/private_key.pem
    # Option 2: Let's Encrypt: /etc/letsencrypt/live/your-domain/privkey.pem
    # Option 3: Corporate: /path/to/ssl/private.key
    SSLCertificateKeyFile /path/to/ssl/private.key
    
    # Path to CA bundle (optional, only if you have a certificate chain)
    # SSLCertificateChainFile /path/to/ssl/ca-bundle.crt
    
    # Intermediate certificates (alternative to chain file)
    # SSLCACertificateFile /path/to/ssl/intermediate.crt
    
    # Modern SSL/TLS Security Settings (recommended)
    # Disable older, insecure protocols
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    
    # Strong cipher suite
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on
    
    # Enable HTTP/2 for better performance (if available)
    # Protocols h2 http/1.1
    
    # ============================================================================
    # Reverse Proxy Configuration
    # ============================================================================
    
    # Preserve the original Host header
    ProxyPreserveHost On
    
    # Forward all requests to Node.js application
    # Adjust port if you changed PORT in .env file
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
    
    # Timeout settings (adjust based on your application needs)
    ProxyTimeout 300
    
    # ============================================================================
    # WebSocket Support (for real-time features)
    # ============================================================================
    
    RewriteEngine On
    
    # WebSocket upgrade
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://localhost:3000/$1 [P,L]
    
    # Regular HTTP traffic
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://localhost:3000/$1 [P,L]
    
    # ============================================================================
    # Proxy Headers (preserve client information)
    # ============================================================================
    
    # Tell the application it's behind HTTPS
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    
    # Preserve client IP address
    ProxyAddHeaders On
    
    # Alternative method to set X-Forwarded-For (if ProxyAddHeaders doesn't work)
    # RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    
    # ============================================================================
    # Access Control (VPN Restriction)
    # ============================================================================
    
    # Restrict access to VPN network only
    <Proxy *>
        Order deny,allow
        Deny from all
        
        # Allow access from VPN subnet
        # Common private network ranges:
        Allow from 10.0.0.0/8         # Class A private network
        # Allow from 172.16.0.0/12    # Class B private network
        # Allow from 192.168.0.0/16   # Class C private network
        
        # Or allow specific IP addresses/subnets:
        # Allow from 192.168.1.0/24
        # Allow from 10.5.10.100
        
        # Allow from localhost (for testing)
        Allow from 127.0.0.1
        Allow from ::1
    </Proxy>
    
    # ============================================================================
    # Logging
    # ============================================================================
    
    # Error log location
    ErrorLog ${APACHE_LOG_DIR}/dependability-tracker-error.log
    
    # Access log with combined format (includes referrer and user agent)
    CustomLog ${APACHE_LOG_DIR}/dependability-tracker-access.log combined
    
    # Optional: More verbose logging for debugging
    # LogLevel info ssl:warn proxy:debug
    
    # ============================================================================
    # Optional: Additional Security Headers
    # ============================================================================
    
    # Prevent clickjacking
    Header always set X-Frame-Options "SAMEORIGIN"
    
    # Enable XSS protection
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    
    # Strict Transport Security (force HTTPS)
    # Enable after confirming HTTPS works correctly
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Content Security Policy (customize based on your needs)
    # Header always set Content-Security-Policy "default-src 'self';"
    
    # ============================================================================
    # Optional: Static File Caching
    # ============================================================================
    
    # Cache static assets for better performance
    <LocationMatch "\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$">
        Header set Cache-Control "max-age=604800, public"
    </LocationMatch>
    
    # ============================================================================
    # Optional: Compression
    # ============================================================================
    
    # Enable gzip compression for text-based content
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

</VirtualHost>

# ============================================================================
# HTTP to HTTPS Redirect (Optional but Recommended)
# ============================================================================

<VirtualHost *:80>
    ServerName dependability-tracker.yourdomain.com
    
    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://dependability-tracker.yourdomain.com/
    
    # Alternative using mod_rewrite:
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ============================================================================
# Notes
# ============================================================================
#
# 1. Certificate Paths:
#    - Self-signed (from project): Use cert/certificate.pem and cert/private_key.pem
#    - Let's Encrypt: Usually in /etc/letsencrypt/live/your-domain/
#    - Corporate CA: Obtain from your IT/security team
#
# 2. VPN Subnet:
#    - Linux: ip addr show | grep tun (for OpenVPN)
#    - macOS: ifconfig (look for tun or utun interfaces)
#    - Or: consult your network administrator for the VPN subnet
#
# 3. Port Configuration:
#    - Default: Node.js runs on port 3000
#    - If changed in .env: Update ProxyPass and ProxyPassReverse accordingly
#
# 4. Testing:
#    - Test config: apache2ctl configtest (or apachectl configtest)
#    - Test connection: curl -k https://your-server-address
#    - Check logs: tail -f /var/log/apache2/dependability-tracker-error.log
#
# 5. SELinux (RHEL/CentOS/Fedora):
#    If you get permission errors, configure SELinux:
#    sudo setsebool -P httpd_can_network_connect 1
#    sudo semanage port -a -t http_port_t -p tcp 3000
#
# 6. Firewall:
#    - Ubuntu/Debian: sudo ufw allow 443/tcp
#    - RHEL/CentOS: sudo firewall-cmd --permanent --add-service=https && sudo firewall-cmd --reload
#
# 7. Performance Tuning:
#    For high-traffic scenarios, consider:
#    - Increasing ProxyTimeout
#    - Configuring connection pooling
#    - Enabling HTTP/2
#    - Setting up load balancing (if multiple instances)
#
# ============================================================================
