<VirtualHost *:443>
    ServerName your-domain.com
    SSLEngine on
    
    # SSL Certificate Configuration
    # Update these paths with your actual SSL certificate locations
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key
    # SSLCertificateChainFile /path/to/your/chain.crt  # Uncomment if you have a chain file
    
    <Directory /var/www/html/>
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    RewriteEngine on

    ServerPath "/dc/"

    RewriteRule "^/dc/(.*)" http://127.0.0.1:3000/$1 [P,L]
    ProxyPass /dc "http://127.0.0.1:3000/"
    ProxyPassReverse /dc "http://127.0.0.1:3000/"

    RewriteRule "^/_next/(.*)" http://127.0.0.1:3000/_next/$1 [P,L]
    ProxyPass /_next "http://127.0.0.1:3000/_next"
    ProxyPassReverse /_next "http://127.0.0.1:3000/_next"

    RewriteRule "^/api/(.*)" http://127.0.0.1:3000/api/$1 [P,L]
    ProxyPass /api "http://127.0.0.1:3000/api"
    ProxyPassReverse /api "http://127.0.0.1:3000/api"
    
    <Location "/dc">
        # Allow access to this proxied URL location for everyone.
        Require all granted
    </Location>
</VirtualHost>

